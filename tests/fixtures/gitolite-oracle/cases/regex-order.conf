@devs = alice bob
@leads = @devs carol
repo app
    - refs/heads/(wip|tmp)/ = @all
    RW+ refs/heads/[a-z]+/.* = @devs
    RW refs/tags/v[0-9]+(\.[0-9]+)*$ = @leads
    - refs/tags/v0 = @all
    RW+ refs/heads/feature/.* = mallory
    - refs/heads/feature/x.* = mallory
    RW refs/heads/release-[0-9]{2,4}$ = dave
    RW refs/heads/x[^0-9]?y$ = eve
